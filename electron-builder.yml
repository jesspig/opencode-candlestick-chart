appId: com.opencode.candlestickchart
productName: OpenCode Candlestick Chart
copyright: Copyright © 2026

directories:
  output: dist

extraResources:
  - from: plugin
    to: plugin
    filter:
      - "*.ts"
      - "package.json"

win:
  target:
    - target: portable
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
